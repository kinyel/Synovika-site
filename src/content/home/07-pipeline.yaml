order: 7
eyebrow: How we work
heading: Seven stages, and you always know which one we're in.
lit: "which one we're in."
lead: Every project moves through the same steps, and each one ends with something you can see.
items:
  - title: Discover
    body: We learn how your business really runs, and you get a short write-up of what we heard.
  - title: Requirements
    body: You get a clear list of what the software must do, agreed before anyone builds.
  - title: Architecture
    body: You get a plan of the parts and how they fit, with the reasons for each choice.
  - title: Build
    body: You see working pieces early and often, not one big reveal at the end.
  - title: Test
    body: We test on real phones and slow networks, and you get the results.
  - title: Launch
    body: We go live carefully, with a plan for rolling back if anything misbehaves.
  - title: Maintain
    body: We keep it updated and watched, and tell you what we did each month.
